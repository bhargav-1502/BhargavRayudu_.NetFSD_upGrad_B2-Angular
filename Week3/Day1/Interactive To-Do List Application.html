<!DOCTYPE html>
<html>
<head>
    <title>Interactive To-Do List</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            width: 400px;
            margin: 50px auto;
        }

        #taskInput {
            width: 70%;
            padding: 8px;
        }

        #addBtn {
            padding: 8px 12px;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li.completed span.taskText {
            text-decoration: line-through;
            color: gray;
        }

        button.deleteBtn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
        }

        .counts {
            margin-top: 15px;
        }
    </style>
</head>
<body>

     <h2>To-Do List</h2>
         <input type="text" id="taskInput" placeholder="Enter a task">
         <button id="addBtn">Add</button>

     <ul id="taskList"></ul>

     <div class="counts">
         Total Tasks: <span id="totalCount">0</span> |
         Completed Tasks: <span id="completedCount">0</span>
    </div>

<script>
$(document).ready(function() {

    // Function to update counts
    function updateCounts() {
        var total = $("#taskList li").length;
        var completed = $("#taskList li.completed").length;
        $("#totalCount").text(total);
        $("#completedCount").text(completed);
    }

    // Add task
    $("#addBtn").click(function() {
        var task = $("#taskInput").val().trim();
        if(task !== "") {
            var taskItem = `
            <li>
                <span class="taskText">${task}</span>
                <button class="deleteBtn">Delete</button>
            </li>`;
            $("#taskList").append(taskItem);
            $("#taskInput").val("");
            updateCounts();
        }
    });

    //marking task as complete
    $("#taskList").on("click", "span.taskText", function() {
        $(this).parent("li").toggleClass("completed");
        updateCounts();
    });

    // delete task
    $("#taskList").on("click", ".deleteBtn", function() {
        $(this).parent("li").remove();
        updateCounts();
    });

});
</script>

</body>
</html>
