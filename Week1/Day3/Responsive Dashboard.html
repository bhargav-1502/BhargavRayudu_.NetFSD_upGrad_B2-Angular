<!DOCTYPE html>
<html>
<head>
    <title>Responsive Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 220px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            margin: 15px 0;
        }

        .sidebar ul li a {
            color: white;
            text-decoration: none;
        }

        .main {
            flex: 1;
            padding: 20px;
            background-color: #f4f6f9;
        }

        .main h1 {
            margin-bottom: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
        }

        .card {
            flex: 1;
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {

            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                display: flex;
                justify-content: space-around;
                align-items: center;
            }

            .sidebar ul {
                display: flex;
                gap: 20px;
            }

            .sidebar ul li {
                margin: 0;
            }

            .cards {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h2>Admin</h2>
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Users</a></li>
                <li><a href="#">Reports</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </div>

        <div class="main">
            <h1>Dashboard Overview</h1>

            <div class="cards">
                <div class="card">
                    <h3>Total Users</h3>
                    <p>1,500</p>
                </div>

                <div class="card">
                    <h3>Revenue</h3>
                    <p>$25,000</p>
                </div>

                <div class="card">
                    <h3>Orders</h3>
                    <p>350</p>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
