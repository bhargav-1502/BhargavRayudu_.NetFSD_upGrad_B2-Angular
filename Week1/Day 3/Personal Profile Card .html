<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Profile Card</title>

    <style>
        body {
            background-color: #f2f4f8;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        .card {
            width: 350px;
            background-color: #ffffff;
            margin: 80px auto;            
            padding: 25px;                
            border: 2px solid #2c3e50;    
            border-radius: 12px;
            text-align: center;
        }

        .card h1 {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .role {
            font-size: 18px;
            font-weight: 600;
            color: #555;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .description {
            font-size: 14px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 18px;
            width: 100%;                 
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
            background-color: #2c3e50;
            border-radius: 6px;
        }

        .btn:hover {
            background-color: #1abc9c;
        }

    </style>
</head>

<body>

    <div class="card">
        <h1>Rayudu Bhargav</h1>
        <div class="role">Full Stack Developer</div>
        <p class="description">
            Enthusiastic Full Stack Developer skilled in designing and developing 
            complete web applications using both front-end and back-end technologies. 
            Passionate about building responsive interfaces, managing databases, 
            and creating scalable web solutions.
        </p>
        <a href="#" class="btn">Contact Me</a>
    </div>

</body>
</html>
