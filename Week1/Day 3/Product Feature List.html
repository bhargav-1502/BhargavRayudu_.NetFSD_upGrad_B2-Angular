<!DOCTYPE html>
<html>
<head>
    <title>Product Feature List</title>

    <style>
        body {
            font-family: Georgia, serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .features-section {
            width: 500px;
            margin: 60px auto;
            padding: 20px;
            background-color: #ffffff;
            border: 2px solid #cccccc;
        }

        .features-section h2 {
            text-align: center;
            color: #333333;
            margin-bottom: 20px;
        }

        .features-section ul {
            list-style-type: none;
            padding: 0;
        }

        .features-section ul li {
            background-color: #e6f2ff;
            color: #222222;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #99ccff;
        }

        .features-section ul li:hover {
            background-color: #ffcccb;
            color: #000000;
        }
    </style>
</head>

<body>

    <section class="features-section">
        <h2>Product Features</h2>

        <ul>
            <li>High Performance and Fast Loading</li>
            <li>Responsive Design Layout</li>
            <li>Secure Authentication System</li>
            <li>Cloud Data Backup</li>
            <li>24/7 Technical Support</li>
        </ul>
    </section>

</body>
</html>
