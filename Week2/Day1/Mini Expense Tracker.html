<!DOCTYPE html>
<html>
<head>
    <title>Mini Expense Tracker</title>
</head>
<body>

<h2>Mini Expense Tracker</h2>

Title:<input type="text" id="title"><br><br>
Amount:<input type="number" id="amount"><br><br>
Date:<input type="date" id="date"><br><br>

<button onclick="addExpense()">Add Expense</button>
<button onclick="viewExpenses()">View Expenses</button>
<button onclick="deleteExpense()">Delete Expense</button>

<ul id="expenseList"></ul>

<script>

var db;

// Open Database
var request = indexedDB.open("ExpenseDB", 1);

request.onupgradeneeded = function(event) {
    db = event.target.result;
    db.createObjectStore("expenses", { keyPath: "id", autoIncrement: true });
};

request.onsuccess = function(event) {
    db = event.target.result;
};

request.onerror = function(event) {
    alert("Database Error: " + event.target.errorCode);
};

// Add Expense
function addExpense() {

    var title = document.getElementById("title").value;
    var amount = document.getElementById("amount").value;
    var date = document.getElementById("date").value;

    var transaction = db.transaction(["expenses"], "readwrite");
    var store = transaction.objectStore("expenses");

    var expense = {
        title: title,
        amount: amount,
        date: date
    };

    store.add(expense);

    transaction.oncomplete = function() {
        alert("Expense Added");
    };

    transaction.onerror = function() {
        alert("Transaction Error");
    };
}

// View Expenses
function viewExpenses() {

    var transaction = db.transaction(["expenses"], "readonly");
    var store = transaction.objectStore("expenses");

    var list = document.getElementById("expenseList");
    list.innerHTML = "";

    store.openCursor().onsuccess = function(event) {

        var cursor = event.target.result;

        if (cursor) {
            var li = document.createElement("li");
            li.innerHTML =
                "ID: " + cursor.value.id +
                " | " + cursor.value.title +
                " | " + cursor.value.amount +
                " | " + cursor.value.date;
            list.appendChild(li);

            cursor.continue();
        }
    };
}

// Delete Expense
function deleteExpense() {

    var id = prompt("Enter Expense ID to Delete:");
    id = Number(id);

    var transaction = db.transaction(["expenses"], "readwrite");
    var store = transaction.objectStore("expenses");

    store.delete(id);

    transaction.oncomplete = function() {
        alert("Expense Deleted");
        viewExpenses();
    };

    transaction.onerror = function() {
        alert("Delete Failed");
    };
}

</script>

</body>
</html>
