<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

  <div class="container mt-4">
    <h2 class="text-center mb-4">Training Institute Dashboard</h2>

    <div class="row">

      <!-- Registration Form -->
      <div class="col-12 col-md-5 mb-4">
        <div class="card p-4 shadow-sm">
          <h4 class="mb-3 text-center">Student Registration</h4>
          <form>

            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" placeholder="Enter name" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Course</label>
              <input type="text" class="form-control" placeholder="Enter course" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Contact Number</label>
              <input type="tel" class="form-control" placeholder="Enter 10-digit number" pattern="[0-9]{10}" title="Enter a valid 10-digit contact number" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>
        </div>
      </div>

      <!-- Registered Students -->
      <div class="col-12 col-md-7 mb-4">
        <div class="card p-4 shadow-sm">
          <h4 class="mb-3 text-center">Registered Students</h4>
          <div class="table-responsive">
            <table class="table table-bordered table-striped">
              <thead class="table-dark">
                <tr>
                  <th>Name</th>
                  <th>Course</th>
                  <th>Email</th>
                  <th>Contact</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Arjun</td>
                  <td>Web Development</td>
                  <td>arjun@email.com</td>
                  <td>9800111234</td>
                </tr>
                <tr>
                  <td>Sneha</td>
                  <td>Data Science</td>
                  <td>sneha@email.com</td>
                  <td>9911255678</td>
                </tr>
                <tr>
                  <td>Karan</td>
                  <td>UI/UX Design</td>
                  <td>karan@email.com</td>
                  <td>7005533210</td>
                </tr>
                <tr>
                  <td>Deepika</td>
                  <td>Cloud Computing</td>
                  <td>deepika@email.com</td>
                  <td>8110044321</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
